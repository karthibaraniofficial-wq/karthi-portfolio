<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="footerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="glowFooter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <style>
      .footer-bg { fill: url(#footerBgDark); stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .horizon-line { stroke: #1e293b; stroke-width: 0.8; stroke-dasharray: 2 4; }
      .text-motto { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 3px; }
      .text-author { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #38bdf8; font-weight: 600; letter-spacing: 2px; }
      .text-coord { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #64748b; letter-spacing: 1.5px; }

      @media (prefers-color-scheme: light) {
        .footer-bg { fill: url(#footerBgLight); stroke: #cbd5e1; }
        .horizon-line { stroke: #cbd5e1; }
        .text-motto { fill: #0f172a; }
        .text-author { fill: #0284c7; }
        .text-coord { fill: #64748b; }
      }
    </style>
  </defs>

  <rect x="5" y="5" width="910" height="130" class="footer-bg" />

  <!-- Perspective Horizon Grid Lines -->
  <line x1="160" y1="125" x2="460" y2="40" class="horizon-line" />
  <line x1="280" y1="125" x2="460" y2="40" class="horizon-line" />
  <line x1="400" y1="125" x2="460" y2="40" class="horizon-line" />
  <line x1="520" y1="125" x2="460" y2="40" class="horizon-line" />
  <line x1="640" y1="125" x2="460" y2="40" class="horizon-line" />
  <line x1="760" y1="125" x2="460" y2="40" class="horizon-line" />

  <line x1="50" y1="90" x2="870" y2="90" class="horizon-line" />
  <line x1="100" y1="110" x2="820" y2="110" class="horizon-line" />

  <!-- Center Telemetry Beacon -->
  <circle cx="460" cy="40" r="16" fill="url(#glowFooter)" />
  <circle cx="460" cy="40" r="3.5" fill="#38bdf8" />

  <!-- Typography -->
  <text x="460" y="70" text-anchor="middle" class="text-motto">BUILDING INTELLIGENCE. ONE SYSTEM AT A TIME.</text>
  <text x="460" y="90" text-anchor="middle" class="text-author">KARTHI // AI &amp; ML SYSTEMS DEVELOPER</text>
  <text x="460" y="112" text-anchor="middle" class="text-coord">TAMIL NADU, INDIA · LAT 11.0° N · PERSISTENT COMPUTATION</text>
</svg>
